services:
  postgres:
    image: postgres:17-alpine
    container_name: vitorias-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vitorias
      POSTGRES_PASSWORD: vitorias
      POSTGRES_DB: vitorias
    ports:
      # Só no próprio computador: o Next escuta na rede local, o banco não.
      - "127.0.0.1:5432:5432"
    volumes:
      - vitorias-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitorias -d vitorias"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vitorias-postgres-data:
